[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifygate"
version = "0.1.0"
description = "Delegate work only when a machine can tell you it was done: a verification gate for coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tsuruta Lab" }]
keywords = ["codex", "claude", "coding agent", "verification", "code review", "delegation", "git worktree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tsurutanmen/verifygate"
Issues = "https://github.com/tsurutanmen/verifygate/issues"

[project.scripts]
verifygate = "verifygate.cli:main"

[tool.setuptools.packages.find]
include = ["verifygate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
